[package]
name = "belvedere"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
authors = ["Erik Rose <erik.w.rose@gmail.com>"]
description = "A beautiful view of the amenable library."

[dependencies]
amenable = { path = "../amenable/crates/amenable", version = "0.1.0" }
amenable_core = { path = "../amenable/crates/amenable_core", version = "0.1.0" }
amenable_derive = { path = "../amenable/crates/amenable_derive", version = "0.1.0" }
derive-getters = "0.5.0"
derive-new = "0.7.0"
derive_setters = "0.1.9"
derive_builder = "0.20.2"
elicitation = { path = "../elicitation/crates/elicitation" }
elicit_ui = { path = "../elicitation/crates/elicit_ui" }
inventory = "0.3.24"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
thiserror = "2.0.16"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }

[dev-dependencies]
miette = "7.6.0"

[lints.clippy]
# Temporarily disabled workspace-wide -- a confirmed upstream tooling
# bug, not a real finding. Rust 1.99.0 (released 2026-09-28) started
# misattributing this lint to `derive_new::new`'s generated
# `Self { field: field }` constructor body back onto the struct's own
# field declarations, rather than the macro's call site -- confirmed
# with a minimal, zero-dependency, out-of-workspace repro (a bare
# two-field struct, `#[derive(derive_new::new)]`, nothing else) that
# reproduces the exact same misattributed error. `derive-new` 0.7.0 is
# still the latest release as of this writing, so there is no upstream
# fix to pick up yet, and the bug is universal to the derive (not
# specific to any field shape, attribute, or combination with other
# derives we tried) -- it would otherwise hit every one of the
# `#[derive(derive_new::new)]` sites across this crate, not a handful of
# real findings worth hand-fixing one at a time. A real
# `redundant_field_names` finding in genuinely hand-written code is
# still worth fixing on sight; this entry only silences the false
# positive the macro itself triggers.
#
# Revisit by 2027-04-03 (six months out): check whether a newer
# `derive-new` release or a clippy fix has landed, and either remove
# this override, patch `derive-new` upstream ourselves, or replace it
# crate-wide if neither has moved.
redundant_field_names = "allow"
